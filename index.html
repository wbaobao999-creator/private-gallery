<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>私人云图库</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#1c1c1c;color:white}
.topbar{height:56px;background:#151515;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #333}
.topbar h2{font-size:18px;margin:0}
.toolbar{padding:20px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upload{background:#0ea5e9;color:white;border-radius:8px;padding:10px 14px;cursor:pointer}
.upload input{display:none}
button{background:#2b2b2b;color:white;border:none;border-radius:8px;padding:10px 14px;cursor:pointer}
.grid{display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.card{width:220px;background:#111;border:1px solid #444;border-radius:10px;padding:8px}
.card img,.card video{width:100%;height:160px;object-fit:cover;border-radius:8px;cursor:pointer}
.name{font-size:12px;color:#ccc;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:999}
.preview img{max-width:92vw;max-height:92vh;object-fit:contain}
.notice{padding:0 24px;color:#bbb}
footer{position:fixed;bottom:14px;width:100%;text-align:center;color:#888;font-size:12px;pointer-events:none}
@media(max-width:700px){.card{width:45%}.card img,.card video{height:120px}}
</style>
</head>
<body>

<div class="topbar">
  <h2>私人云图库</h2>
</div>

<div class="toolbar">
  <label class="upload">＋ 上传照片/视频
    <input type="file" accept="image/*,video/*" multiple onchange="uploadFiles(this.files)">
  </label>
  <button onclick="loadFiles()">刷新</button>
  <span style="color:#aaa">Supabase 云端保存，任何人打开网址都能看到</span>
</div>

<div id="notice" class="notice">读取中...</div>
<div id="grid" class="grid"></div>
<div id="preview"></div>

<footer>本网站内容仅供私人浏览 © 2026</footer>

<script>
const SUPABASE_URL = "https://lkrztdewycwcqjycusay.supabase.co";
const SUPABASE_KEY = "sb_publishable_JOoemeZyMqq8q5o6edJpew_yVBp_MOU";
const BUCKET = "gallery";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const fallbackFiles = [
  {
    name:"photo_2025-01-24_03-39-29.jpg",
    url:"https://lkrztdewycwcqjycusay.supabase.co/storage/v1/object/public/gallery/photo_2025-01-24_03-39-29.jpg",
    type:"photo"
  }
];

function isMedia(name){
  const n = name.toLowerCase();
  return n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".png") || n.endsWith(".webp") || n.endsWith(".gif") ||
         n.endsWith(".mp4") || n.endsWith(".mov") || n.endsWith(".webm") || n.endsWith(".m4v");
}

function isVideo(name){
  const n = name.toLowerCase();
  return n.endsWith(".mp4") || n.endsWith(".mov") || n.endsWith(".webm") || n.endsWith(".m4v");
}

function publicUrl(path){
  return client.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function loadFiles(){
  document.getElementById("notice").innerText = "读取中...";

  try{
    const { data, error } = await client.storage.from(BUCKET).list("", {
      limit:100,
      sortBy:{column:"created_at", order:"desc"}
    });

    if(error) throw error;

    let files = (data || [])
      .filter(f => f.name && isMedia(f.name))
      .map(f => ({
        name:f.name,
        url:publicUrl(f.name),
        type:isVideo(f.name) ? "video" : "photo"
      }));

    if(files.length === 0){
      files = fallbackFiles;
      document.getElementById("notice").innerText = "暂时读取不到列表，先显示测试图片。";
    }else{
      document.getElementById("notice").innerText = "已读取 " + files.length + " 个文件";
    }

    render(files);
  }catch(e){
    document.getElementById("notice").innerText = "读取失败，先显示测试图片。错误：" + e.message;
    render(fallbackFiles);
  }
}

function render(files){
  document.getElementById("grid").innerHTML = files.map(item => `
    <div class="card">
      ${item.type === "video"
        ? `<video src="${item.url}" controls></video>`
        : `<img src="${item.url}" onclick="openPreview('${encodeURIComponent(item.url)}')">`}
      <div class="name">${item.name}</div>
    </div>
  `).join("");
}

function openPreview(url){
  const real = decodeURIComponent(url);
  document.getElementById("preview").innerHTML = `
    <div class="preview" onclick="closePreview()">
      <img src="${real}">
    </div>
  `;
}

function closePreview(){
  document.getElementById("preview").innerHTML = "";
}

function cleanName(name){
  const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "jpg";
  return "file-" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "." + ext;
}

async function uploadFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;

  for(const file of files){
    const path = cleanName(file.name);

    const { error } = await client.storage.from(BUCKET).upload(path, file, {
      cacheControl:"3600",
      upsert:false
    });

    if(error){
      alert("上传失败：" + error.message);
      return;
    }
  }

  await loadFiles();
}

loadFiles();
</script>

</body>
</html>
